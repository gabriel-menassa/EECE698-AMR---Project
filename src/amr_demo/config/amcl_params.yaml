amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "vehicle_blue/chassis"
    odom_frame_id: "vehicle_blue/odom"
    global_frame_id: "map"
    scan_topic: "/lidar"

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    min_particles: 500
    max_particles: 2000

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    update_min_d: 0.15
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 1.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
